<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scanner iPhone – ZXing Pro</title>

<style>
  body {
    font-family: Arial, sans-serif;
    padding: 20px;
    text-align: center;
  }

  #video {
    width: 100%;
    max-width: 400px;
    border: 3px solid #4CAF50;
    border-radius: 10px;
    margin-top: 20px;
  }

  #frame {
    position: absolute;
    border: 3px solid red;
    width: 200px;
    height: 120px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }

  input, button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    font-size: 16px;
  }

  button {
    background-color: #4CAF50;
    color: white;
    border: none;
  }
</style>

<!-- ZXing non-module -->
<script src="https://unpkg.com/@zxing/library@latest"></script>

<script>
  const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxGhOoSIky3MCVhP_97iJOAvn4DFJSgTGuBkEZt3sdCVAVOZbTlZvZlJFLs28th0QbO/exec";

  let selectedDeviceId;
  let codeReader;

  async function startScanner() {
    codeReader = new ZXing.BrowserMultiFormatReader();

    const video = document.getElementById("video");

    try {
      const devices = await ZXing.BrowserMultiFormatReader.listVideoInputDevices();
      selectedDeviceId = devices[devices.length - 1].deviceId;

      enableZoom(video);
      enableTapToFocus(video);

      codeReader.decodeFromVideoDevice(selectedDeviceId, video, (result, err) => {
        if (result) {
          const code = result.getText();
          document.getElementById("codebarres").value = code;
          beep();
          alert("Code détecté : " + code);
          codeReader.reset();
        }
      });

    } catch (err) {
      alert("Erreur caméra : " + err);
    }
  }

  function enableZoom(video) {
    video.addEventListener("wheel", (event) => {
      const track = video.srcObject.getVideoTracks()[0];
      const capabilities = track.getCapabilities();
      if (!capabilities.zoom) return;

      let zoom = track.getSettings().zoom || capabilities.zoom.min;
      zoom += event.deltaY * -0.01;
      zoom = Math.max(capabilities.zoom.min, Math.min(capabilities.zoom.max, zoom));

      track.applyConstraints({ advanced: [{ zoom }] });
    });
  }

  function enableTapToFocus(video) {
    video.addEventListener("click", () => {
      const track = video.srcObject.getVideoTracks()[0];
      const capabilities = track.getCapabilities();
      if (capabilities.focusMode && capabilities.focusMode.includes("single-shot")) {
        track.applyConstraints({ advanced: [{ focusMode: "single-shot" }] });
      }
    });
  }

  function beep() {
    const audio = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");
    audio.play();
  }

  async function envoyer() {
    const payload = {
      codebarres: document.getElementById("codebarres").value,
      titre: document.getElementById("titre").value,
      artistes: document.getElementById("artistes").value,
      pays: document.getElementById("pays").value,
      labels: document.getElementById("labels").value
    };

    try {
      await fetch(WEBAPP_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      alert("Enregistrement réussi !");
    } catch (err) {
      alert("Erreur : " + err);
    }
  }

  function nouveauScan() {
    document.getElementById("codebarres").value = "";
    startScanner();
  }
</script>

</head>
<body>

<h2>Scanner iPhone – ZXing Pro</h2>

<button onclick="startScanner()">📷 Ouvrir la caméra</button>

<div style="position:relative;">
  <video id="video" playsinline></video>
  <div id="frame"></div>
</div>

<button onclick="nouveauScan()">🔄 Nouveau scan</button>

<input type="text" id="codebarres" placeholder="Code-barres détecté">

<input type="text" id="titre" placeholder="Titre">
<input type="text" id="artistes" placeholder="Artistes">
<input type="text" id="pays" placeholder="Pays">
<input type="text" id="labels" placeholder="Labels">

<button onclick="envoyer()">Envoyer</button>

</body>
</html>
