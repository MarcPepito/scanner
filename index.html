  body {
    font-family: Arial, sans-serif;

  video {

    max-width: 400px;

    border-radius: 10px;

  input, button {

  button {
    background-color: #4CAF50;
    color: white;
    border: none;
  }

<!-- ZXing -->
<script type="module">
  import { BrowserMultiFormatReader } from "https://cdn.jsdelivr.net/npm/@zxing/library@latest/+esm";

  const WEBAPP_URL ="https://script.google.com/macros/s/AKfycbxGhOoSIky3MCVhP_97iJOAvn4DFJSgTGuBkEZt3sdCVAVOZbTlZvZlJFLs28th0QbO/exec"
;

  let codeReader;
  let videoElement;

  async function startScanner() {
    codeReader = new BrowserMultiFormatReader();

    videoElement = document.getElementById("video");

    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "environment",
          zoom: true
        }
      });

      videoElement.srcObject = stream;
      videoElement.setAttribute("playsinline", true);
      videoElement.play();

      enableZoom(videoElement);

      codeReader.decodeFromVideoDevice(null, videoElement, (result, err) => {
        if (result) {
          const code = result.getText();
          document.getElementById("codebarres").value = code;
          alert("Code détecté : " + code);
          codeReader.reset();
        }
      });

    } catch (err) {
      alert("Erreur caméra : " + err);
    }
  }
