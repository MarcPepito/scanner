<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scanner iPhone – QuaggaJS</title>

<style>
  body {
    font-family: Arial, sans-serif;
    padding: 20px;
    text-align: center;
  }

  #interactive {
    position: relative;
    width: 100%;
    max-width: 400px;
    margin: 20px auto;
    border: 2px solid #333;
    border-radius: 10px;
  }

  #frame {
    position: absolute;
    border: 3px solid #00ff00;
    width: 70%;
    height: 30%;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }

  input, button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    font-size: 16px;
  }

  button {
    background-color: #4CAF50;
    color: white;
    border: none;
  }
</style>

<!-- QuaggaJS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>

<script>
  // 👉 Mets ici TON URL WebApp Google Apps Script
  const WEBAPP_URL ="https://script.google.com/macros/s/AKfycbxGhOoSIky3MCVhP_97iJOAvn4DFJSgTGuBkEZt3sdCVAVOZbTlZvZlJFLs28th0QbO/exec";

  function startScanner() {
    Quagga.init({
      inputStream: {
        name: "Live",
        type: "LiveStream",
        target: document.querySelector('#interactive'),
        constraints: {
          facingMode: "environment"
        }
      },
      decoder: {
        readers: ["ean_reader", "ean_8_reader", "upc_reader", "code_128_reader"]
      }
    }, function(err) {
      if (err) {
        alert("Erreur Quagga : " + err);
        return;
      }
      Quagga.start();
    });

    Quagga.onDetected(function(result) {
      const code = result.codeResult.code;
      document.getElementById("codebarres").value = code;
      beep();
      alert("Code détecté : " + code);
      Quagga.stop();
    });
  }

  function beep() {
    const audio = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");
    audio.play();
  }

  function nouveauScan() {
    document.getElementById("codebarres").value = "";
    Quagga.stop();
    startScanner();
  }

  async function envoyer() {
    const payload = {
      codebarres: document.getElementById("codebarres").value,
      titre: document.getElementById("titre").value,
      artistes: document.getElementById("artistes").value,
      pays: document.getElementById("pays").value,
      labels: document.getElementById("labels").value
    };

    try {
      await fetch(WEBAPP_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      alert("Enregistrement réussi !");
    } catch (err) {
      alert("Erreur : " + err);
    }
  }
</script>

</head>
<body>

<h2>Scanner iPhone – QuaggaJS</h2>

<button onclick="startScanner()">📷 Ouvrir la caméra</button>

<div id="interactive">
  <div id="frame"></div>
</div>

<button onclick="nouveauScan()">🔄 Nouveau scan</button>

<input type="text" id="codebarres" placeholder="Code-barres détecté">

<input type="text" id="titre" placeholder="Titre">
<input type="text" id="artistes" placeholder="Artistes">
<input type="text" id="pays" placeholder="Pays">
<input type="text" id="labels" placeholder="Labels">

<button onclick="envoyer()">Envoyer</button>

</body>
</html>
